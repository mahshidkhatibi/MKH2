function smp(n){var s=S[n];return s?'<div class="smp"><div><b>نمونه ورودی</b>'+esc(s[0])+'</div><div class="o"><b>نمونه خروجی</b>'+esc(s[1])+'</div></div><p class="nt">نام‌ها، تاریخ‌ها و اطلاعات این نمونه فرضی است و فقط برای آشنایی با نوع خروجی آمده؛ نتیجه واقعی بسته به ابزار و اطلاعات شما متفاوت خواهد بود.</p>':''}
var app=document.getElementById("app");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function sty(g){return 'style="--a:'+G[g].c[0]+';--b:'+G[g].c[1]+'"'}
function cnt(g){return P.filter(function(p){return p[0]===g}).length}
function imgErr(i){var s=i.src;if(/\.jpg$/.test(s)){i.src=s.replace(/\.jpg$/,".png")}else{i.closest("figure").remove()}}
function fig(n,k,t){return '<figure><img src="images/p'+n+'-'+k+'.jpg" alt="'+t+' پرامپت '+n+'" loading="lazy" onerror="imgErr(this)"><figcaption>'+t+'</figcaption></figure>'}
function copyText(t,b){var o=b.textContent;function ok(){b.textContent="کپی شد ✓";b.classList.add("ok");setTimeout(function(){b.textContent=o;b.classList.remove("ok")},1800)}
function fb(){var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){b.textContent="متن را انتخاب و کپی کنید"}document.body.removeChild(a)}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else{fb()}}
function home(){
return '<header class="hero"><div class="em" aria-hidden="true">🤖 ✨ 📚</div><h1>پرامپت‌های کاربردی برای مدیران و معاونان</h1></header><main class="wrap grid">'+
G.map(function(g,i){return '<a class="gc" href="#g'+i+'" '+sty(i)+'><div class="ic" aria-hidden="true">'+g.i+'</div><h2>'+esc(g.n)+'</h2><p>'+esc(g.d)+'</p><span class="pill">'+cnt(i)+' پرامپت</span><span class="go">ورود ←</span></a>'}).join('')+'</main>'}
function group(g){
var h='<header class="gh" '+sty(g)+'><div class="wrap"><a class="back" href="#">→ بازگشت به صفحه اصلی</a><div class="row"><div class="ic" aria-hidden="true">'+G[g].i+'</div><div><h1>'+esc(G[g].n)+'</h1><p>'+cnt(g)+' پرامپت · '+esc(G[g].d)+'</p></div></div></div></header><main class="wrap list" '+sty(g)+'>';
P.forEach(function(p,idx){if(p[0]!==g)return;var n=("0"+(idx+1)).slice(-2);
h+='<details><summary><span class="num">'+(idx+1)+'</span><span>'+esc(p[1])+'<small>خروجی: '+esc(p[2])+'</small></span></summary><div class="body"><div class="imgs">'+fig(n,"in","نمونه ورودی")+fig(n,"out","نمونه خروجی")+'</div>'+smp(idx+1)+'<pre>'+esc(p[3])+'</pre><button class="copy" type="button" data-i="'+idx+'">کپی پرامپت</button></div></details>'});
return h+'<section class="tips"><b>نکات مهم برای استفاده از این کتابخانه</b><ol><li>اطلاعات داخل کروشه را با اطلاعات مدرسه خود جایگزین کنید.</li><li>اگر قرار است فایل، عکس، بخشنامه یا دست‌نوشته‌ای بررسی شود، ابتدا آن را در محیط هوش مصنوعی بارگذاری کنید.</li><li>در موضوعات اداری، حقوقی، آموزشی و ایمنی، خروجی هوش مصنوعی را با اسناد و دستورالعمل‌های معتبر تطبیق دهید.</li><li>اطلاعات هویتی و محرمانه دانش‌آموزان، اولیا و کارکنان را بدون ضرورت در ابزارهای هوش مصنوعی وارد نکنید؛ برای نمونه از نام مستعار استفاده کنید.</li><li>اگر خروجی تصویری فارسی تولید می‌کنید، متن نهایی را از نظر املایی و صحت اطلاعات پیش از چاپ بازبینی کنید.</li></ol><b>اصل طلایی:</b> هوش مصنوعی دستیار مدیر و معاون است؛ تصمیم نهایی و مسئولیت اجرای آن بر عهده انسان است.</section></main>'}
function route(){
var m=/^#g([0-3])$/.exec(location.hash);
app.innerHTML=m?group(+m[1]):home();
document.title=m?G[+m[1]].n+" | پرامپت‌های کاربردی مدیران و معاونان":"پرامپت‌های کاربردی برای مدیران و معاونان";
Array.prototype.forEach.call(app.querySelectorAll(".copy"),function(b){b.onclick=function(){copyText(P[+b.getAttribute("data-i")][3],b)}});
window.scrollTo(0,0)}
window.addEventListener("hashchange",route);route();
</script>
